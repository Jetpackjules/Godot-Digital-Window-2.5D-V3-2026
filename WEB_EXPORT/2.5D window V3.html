		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"2.5D window V3","experimentalVK":false,"fileSizes":{"2.5D window V3.pck":232240,"2.5D window V3.wasm":35749181},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"serviceWorker":"2.5D window V3.service.worker.js"};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>

        <script>
            // Best-effort mobile wake lock so calibration/scan screens do not dim out mid-session.
            window.__godotWakeLock = null;
            window.enableWakeLock = async function () {
                if (!('wakeLock' in navigator) || document.hidden) {
                    return false;
                }
                try {
                    if (window.__godotWakeLock) {
                        return true;
                    }
                    window.__godotWakeLock = await navigator.wakeLock.request('screen');
                    window.__godotWakeLock.addEventListener('release', function () {
                        window.__godotWakeLock = null;
                    });
                    return true;
                } catch (err) {
                    console.warn('Wake lock request failed:', err);
                    return false;
                }
            };

            window.disableWakeLock = async function () {
                if (window.__godotWakeLock) {
                    await window.__godotWakeLock.release();
                    window.__godotWakeLock = null;
                }
            };

            document.addEventListener('visibilitychange', function () {
                if (!document.hidden) {
                    window.enableWakeLock();
                }
            });
'].forEach(function (eventName) {
                window.addEventListener(eventName, function () {
                    window.enableWakeLock();
                }, { passive: true });
            });

            window.addEventListener('load', function () {
                window.enableWakeLock();
            });
        </script>
        

        <script>
            // Best-effort fullscreen helper. Browsers usually require a user gesture,
            // so we try on load and then retry on the first interaction.
            window.__godotFullscreenAttempted = false;
            window.enableGodotFullscreen = async function () {
                if (window.__godotFullscreenAttempted && document.fullscreenElement) {
                    return true;
                }
                var target = document.getElementById('canvas') || document.documentElement;
                if (!target || document.fullscreenElement) {
                    return !!document.fullscreenElement;
                }
                window.__godotFullscreenAttempted = true;
                try {
                    if (target.requestFullscreen) {
                        await target.requestFullscreen();
                        return true;
                    }
                } catch (err) {
                    return false;
                }
                return false;
            };

            window.addEventListener('load', function () {
                window.enableGodotFullscreen();
            });

            ['click', 'touchend', 'keydown'].forEach(function (eventName) {
                window.addEventListener(eventName, function tryFullscreenOnce() {
                    window.enableGodotFullscreen();
                    if (document.fullscreenElement) {
                        window.removeEventListener(eventName, tryFullscreenOnce);
                    }
                }, { passive: true });
            });
        </script>
